# Zero-shot evaluation on Hangzhou (run once with --final); IDQN cannot transfer.
study: final_heldout
dataset: hangzhou
split: heldout
seeds: [0, 1, 2, 3, 4]
tag: final
log_trace: true
table: false

models:
  fixed_time:    {config: configs/eval_baselines.yaml}
  max_pressure:  {config: configs/eval_baselines.yaml}
  dqn:           {config: configs/eval_rl_baselines.yaml}
  ugmarl:
    config: configs/eval_ugmarl.yaml
    log_decisions: true
  ugmarl-nogate:
    config: configs/eval_ugmarl.yaml
    agent: ugmarl
    train_model: ugmarl
    log_decisions: true
    overrides: [agents.ugmarl.use_gate=false]
  ugmarl-noattn:
    config: configs/eval_ugmarl.yaml
    agent: ugmarl
    log_decisions: true
    overrides: [agents.ugmarl.use_attention=false]
  ugmarl-noens:
    config: configs/eval_ugmarl.yaml
    agent: ugmarl
    overrides: [agents.ugmarl.use_ensemble=false]

conditions:
  - {name: real,      data.flow_index: 0}
  - {name: real_5734, data.flow_index: 1}
  - {name: real_5816, data.flow_index: 2}
