# Shared defaults inherited by every experiment config.

seed: 0
deterministic: true

sim:
  engine: cityflow
  threads: 1
  episode_seconds: 3600
  decision_interval: 15  # Δt, seconds
  reward: pressure       # r_i = −|P_i|
  yellow_seconds: 5

features:
  groups: [queue, count, pressure, phase]   # 44 values per intersection
  normalisation: lane_capacity
  vehicle_space_m: 7.5   # vehicle length 5.0 m + min gap 2.5 m
  clip: true

data:
  dataset: jinan         # jinan | hangzhou
  split: train           # train | val | test | heldout

output:
  results_dir: results

robustness:
  noise_std: 0.0         # std of the noise on capacity-scaled lane readings
  dropout_p: 0.0         # per-lane, per-reading detector loss
  surge: 1.0             # demand multiplier

agents:
  fixed_time: {green_seconds: 30}
  max_pressure: {}
  dqn: {hidden: [128, 128]}
  idqn: {hidden: [128, 128]}
  ugmarl:
    use_attention: true
    use_ensemble: true
    use_gate: true
    heads: 5             # K
    attn_dim: 64         # d
    head_hidden: 128
    mask_prob: 0.8
    gate:
      tau: null          # number, or null -> read `file`
      file: auto         # auto = gate.json next to the checkpoint

train:
  agent: dqn             # dqn | idqn | ugmarl
  episodes: 100
  val_every: 5
  device: cpu
  torch_threads: 1
  reward_scale: 0.01
  lr: 3.0e-4
  gamma: 0.9
  batch_size: 64
  buffer_size: 100000
  learning_starts: 2000
  train_every: 4
  target_sync: 1000
  grad_clip: 10.0
  eps_start: 1.0
  eps_end: 0.05
  eps_decay_frac: 0.5

eval:
  seeds: [0, 1, 2, 3, 4]
  track: full            # full | light
