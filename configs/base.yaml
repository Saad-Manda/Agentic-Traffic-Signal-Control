# Shared defaults inherited by every experiment config via `base: base.yaml`.
# sim/features/data values are FROZEN (ROADMAP 3.5, docs/evaluation_protocol.md, 10 Nov 2026);
# change them only with a dated Decision Log entry.

seed: 0                  # override per run; final results use >= 3 seeds
deterministic: true      # torch deterministic kernels (utils/seed.py)

sim:
  engine: cityflow
  threads: 1             # 1 thread per simulator, parallelise across runs (worklog/007)
  episode_seconds: 3600  # frozen
  decision_interval: 15  # Δt in seconds — frozen (EDA: Max-Pressure −8 % vs 10 s on train)
  reward: pressure       # r_i = −|P_i| — frozen
  yellow_seconds: 5      # CityFlow phase 0 = transition (worklog/007)

features:                # observation built by trafficrl.envs.features (ROADMAP 3.4)
  groups: [queue, count, pressure, phase]   # concatenated in this order -> 44 values
  normalisation: lane_capacity   # lane value / lane capacity; nothing is fitted (no leakage)
  vehicle_space_m: 7.5           # vehicle.length 5.0 m + minGap 2.5 m (dataset card §4.1)
  clip: true                     # clip normalised lane values to [0, 1]

data:
  dataset: jinan         # jinan (primary) | hangzhou (held-out) — data/processed/splits.json
  split: train           # train | val | test | heldout — test/heldout only in final evaluation (Phase 7)

output:
  results_dir: results

robustness:              # evaluation conditions (protocol §6; ROADMAP 4.3) — all off = clean
  noise_std: 0.0         # σ on capacity-scaled lane readings; {0, 0.1, 0.2} in 7.3
  dropout_p: 0.0         # per-lane, per-reading detector loss; {0, 0.1, 0.2} in 7.3
  surge: 1.0             # expected demand multiplier (each vehicle duplicated w.p. surge − 1); 1.5 in 7.3

agents:                  # agent parameters, read by trafficrl.agents.make_agent
  fixed_time: {green_seconds: 30}   # protocol §4: 30 s green per phase, order 1 → 8
  max_pressure: {}                  # every Δt, ties → lowest phase id

eval:                    # scripts/evaluate.py
  seeds: [0, 1, 2, 3, 4] # protocol §6 (7.1 / 7.2); 7.3 / 7.4 use [0, 1, 2]
  track: full            # full | light (light skips per-vehicle wait / throughput)
