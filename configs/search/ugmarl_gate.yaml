# Gate calibration: τ = p-th percentile of σ on a clean validation episode.
study: ugmarl_gate
seeds: [0, 1, 2, 3, 4]
percentiles: [80, 90, 95, 99]

conditions:
  - {}
  - {robustness.noise_std: 0.1}
  - {robustness.noise_std: 0.2}
  - {robustness.dropout_p: 0.1}
  - {robustness.dropout_p: 0.2}

selection:
  metric: avg_travel_time_s
  tie_tolerance_s: 1.0
