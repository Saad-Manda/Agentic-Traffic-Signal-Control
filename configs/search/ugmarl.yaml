# Grid over the UG-MARL ensemble size K and attention width d.
study: ugmarl
seed: 0
sampler_seed: 2026
trials: 9

space:
  agents.ugmarl.heads: [3, 5, 10]
  agents.ugmarl.attn_dim: [32, 64, 128]

selection:
  metric: best_val_avg_travel_time_s
  tie_tolerance_s: 1.0
  tie_break: [agents.ugmarl.heads, agents.ugmarl.attn_dim]
