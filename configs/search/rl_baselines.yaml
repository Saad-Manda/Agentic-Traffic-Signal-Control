# Random-search space for the DQN and IDQN hyperparameters.
study: rl_baselines
seed: 0
sampler_seed: 2026
trials: 8

space:
  train.lr: [1.0e-4, 3.0e-4, 1.0e-3]
  train.gamma: [0.8, 0.9, 0.95]
  train.batch_size: [64, 128]
  train.eps_decay_frac: [0.3, 0.5]

selection:
  metric: best_val_avg_travel_time_s
  tie_tolerance_s: 1.0
