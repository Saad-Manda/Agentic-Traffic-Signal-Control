# Sensitivity of UG-MARL to the gate threshold τ (validation only, nothing selected).
study: tau_sensitivity
split: val
variant: ugmarl
seeds: [0, 1, 2, 3, 4]
percentiles: [50, 60, 70]

sigma_source: results/tune/ugmarl_gate_ugmarl_final/sigma_val.csv
check_percentile: 80

conditions:
  - {}
  - {robustness.noise_std: 0.1}
  - {robustness.noise_std: 0.2}
  - {robustness.dropout_p: 0.1}
  - {robustness.dropout_p: 0.2}

existing:
  calibration: docs/results/gate_calibration.csv
  max_pressure: docs/results/val_robustness.csv
p_star: 80

reading:
  insensitive_within_s: 5.0
  tie_tolerance_s: 1.0
