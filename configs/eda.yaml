# EDA rollouts on the train split.
base: base.yaml
seed: 0

data:
  dataset: jinan
  split: train

eda:
  seeds: [0, 1, 2]
  controllers:
    fixed_time:   {green_seconds: 30}
    max_pressure: {decision_interval: 10}
    random:       {decision_interval: 10}
  dt_sweep:
    controller: max_pressure
    values: [5, 10, 15, 20]
  arrival_bin_seconds: 60

output:
  results_dir: results/eda
