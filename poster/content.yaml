title: "Uncertainty-Gated Multi-Agent Reinforcement Learning for Adaptive Traffic Signal Control"
kicker: "Machine Learning Project · Problem Statement 16: Agentic Artificial Intelligence"
author: "Manda Saad"
author_lines:
  - "Roll No. 2401AI28 · manda_2401ai28@iitp.ac.in"
  - "Computer Science and Engineering, Indian Institute of Technology Patna"

problem:
  heading: "Problem"
  text: >-
    Reinforcement-learning (RL) signal controllers cut travel time, but they cannot tell
    when a decision is unreliable and they break down when detector readings differ from
    training. Max-Pressure [1] keeps queues stable but cannot learn. **Aim:** a controller
    that learns, knows when it is unsure, and then hands the decision to a safe rule.

existing:
  heading: "Existing frameworks and their limits"
  items:
    - "**Fixed-Time** (conventional): ignores traffic; {tt@fixed_time@clean} s on the test flow."
    - "**Max-Pressure** (conventional): stable, not learned; {regret@max_pressure@clean} s behind the best controller on clean data."
    - "**Shared DQN** (single agent): best on clean data, but no reliability signal; {tt@dqn@noise0.2} s at detector noise 0.2."
    - "**IDQN** (multi-agent): one network per intersection, cannot move to another city; {tt@idqn@noise0.2} s at noise 0.2."

contributions:
  heading: "Contributions"
  items:
    - "**Ensemble disagreement σ chooses the action** at execution time; earlier ensemble Q-learners use the heads to explore [3]."
    - "**The learned policy leads, Max-Pressure is the fallback** (Com-MP [4] does the reverse), at each intersection separately [5]."
    - "**Evaluation beyond clean benchmarks:** noise, dropout, demand surge, unseen city; attention weights tested before being read as explanations [2]."

setup:
  heading: "Data and protocol"
  items:
    - "**Jinan** 3×4: separate flow files for train, validation and test. **Hangzhou** 4×4 is held out."
    - "**CityFlow**, reward −|pressure|, 1 h episodes, a decision every 15 s; 44 observed values per intersection, scaled by lane capacity."
    - "Choices use train and validation only. Test and Hangzhou **run once**, models locked, **seeds 0–4**."

method:
  heading: "Method: UG-MARL"
  caption: "**Figure 1.** UG-MARL at one intersection (one shared network). The gate acts at evaluation only."
  diagram:   # box texts: first line is the title
    obs: ["Input", "s~i~ and up to 4 neighbours"]
    attention: ["Attention", "weights α~ij~ give z~i~"]
    heads: ["3 Q-heads", "Q~1~ … Q~K~ on shared z~i~"]
    spread: ["Mean, spread", "μ gives a*, σ = std~k~ Q~k~"]
    gate: ["Gate", "σ > τ ?"]
    out: ["Phase a~i~", "to the simulator"]
    mp: ["Max-Pressure", "phase with the largest pressure, from the same observed counts"]
    tau: ["Threshold τ", "p*-th percentile of σ, fitted on validation"]
    train: ["Training (gate off)", "ε-greedy on μ · replay with head masks · Double-DQN target per head · best validation checkpoint"]
    fallback: "used if σ > τ"
    weights: "weights θ"
  rule_title: "Gate rule at every intersection i and every decision"
  rule:
    - "μ(s, a) = mean~k~ Q~k~(s, a),   a* = argmax~a~ μ(s~i~, a),   σ(s~i~) = std~k~ Q~k~(s~i~, a*)"
    - "a~i~ = **Max-Pressure phase** if σ(s~i~) > τ,   otherwise a*"
    - "τ = p-th percentile of σ on one clean validation episode (p* = 80, one τ per seed)"

algorithm:
  heading: "Algorithm 1 (compact)"
  steps:
    - "Split whole flow files: train / validation / test; Hangzhou unopened."
    - "**Train, gate off:** 100 episodes, ε-greedy on μ, replay with Bernoulli(0.8) head masks, Double-DQN target per head; keep the best validation checkpoint."
    - "Choose K = 3 heads, width 128 on validation; train seeds 0–4."
    - "Per seed, τ from σ on validation (p* over five validation conditions)."
    - "Lock weights and τ; run each test condition and Hangzhou flow once; report mean ± std and 95 % CI."

results:
  heading: "Results: Jinan test flow, 5 seeds"
  tiles:
    - value: "{tt@ugmarl@clean} s"
      label: "travel time, clean test"
      note: "Max-Pressure {tt@max_pressure@clean} · IDQN {tt@idqn@clean} · DQN {tt@dqn@clean}"
    - value: "{tt@ugmarl@noise0.2} s"
      label: "travel time, detector noise 0.2"
      note: "DQN {tt@dqn@noise0.2} · IDQN {tt@idqn@noise0.2} · Max-Pressure {tt@max_pressure@noise0.2}"
    - value: "{regret@ugmarl@worst} s"
      label: "largest gap to best controller"
      note: "baselines {regret@baselines@range} s, six test conditions"
  table_caption: "**Table 1.** Average travel time in s (mean ± std over 5 seeds); maximum wait of one vehicle on the clean flow (s); largest regret over six test conditions (s). Bold: best of the five agents. −gate uses the same weights as UG-MARL."
  figure_caption: "**Figure 2.** (a) Lines: mean; bands: 95 % CI. −gate (dashed) is UG-MARL with the gate off. (b) Regret = travel time minus the best of the five agents in the same condition. (c) Gate statistics are associations, not causes."

findings:
  heading: "Findings"
  items:
    - "**H1 performance: supported.** {tt@ugmarl@clean} ± {ttsd@ugmarl@clean} s, 95 % CI below Max-Pressure and IDQN. It is {regret@ugmarl@clean} s behind the shared DQN; the gap is spread over all intersections and is not caused by the gate."
    - "**H2 safety: supported.** At noise 0.2 the gate holds {tt@ugmarl@noise0.2} s where the same weights without it reach {tt@ugmarl-nogate@noise0.2} s, and the maximum wait is {maxw@ugmarl@noise0.2} instead of {maxw@ugmarl-nogate@noise0.2} s. On clean data the gate makes no measurable difference."
    - "**H3 coordination: not supported.** Without attention: {tt@ugmarl-noattn@clean} s with {fewer@ugmarl-noattn} % fewer parameters."
    - "**Unseen city (Hangzhou, no retraining):** UG-MARL {tt@ugmarl@hz-all} ± {ttsd@ugmarl@hz-all} s, DQN {tt@dqn@hz-all} ± {ttsd@dqn@hz-all} s, Max-Pressure {tt@max_pressure@hz-all} s."

limitations:
  heading: "Limitations"
  items:
    - "Under the demand surge the gate raises the maximum wait ({maxw@ugmarl@surge1.5} against {maxw@ugmarl-nogate@surge1.5} s): σ cannot tell faulty detectors from heavy demand."
    - "Wait metrics count waiting inside the network; ungated policies leave 11–14 % of vehicles outside it at noise 0.2."
    - "Five seeds, one test flow per city, simulation only; the gated policy has no stability guarantee."

conclusion:
  heading: "Conclusion"
  text: >-
    A learned controller that falls back to Max-Pressure when its Q-heads disagree keeps
    most of the gain of RL on clean data and avoids its collapse under detector noise:
    the smallest worst-case regret of all controllers tested. Neighbour attention added
    nothing. **Next:** a fallback with a cap on red time, and a gate signal that separates
    bad inputs from heavy demand.

references:
  heading: "References"
  items:
    - "[1] P. Varaiya, Max pressure control of a network of signalized intersections, Transp. Res. Part C 36, 2013."
    - "[2] H. Wei et al., CoLight: learning network-level cooperation for traffic signal control, CIKM 2019."
    - "[3] T. Tan, T. Chu, J. Wang, Multi-agent bootstrapped deep Q-network for large-scale traffic signal control, IEEE CCTA 2020."
    - "[4] J. Zhu, C. Tan, Stability-preserving reinforcement learning for heterogeneity-aware composite max-pressure traffic signal control, arXiv:2610.31037, 2026."
    - "[5] C.-J. Hoel, K. Wolff, L. Laine, Tactical decision-making in autonomous driving by reinforcement learning with uncertainty estimation, IEEE IV 2020."
